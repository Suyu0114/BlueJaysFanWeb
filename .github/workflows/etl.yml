# Daily ETL. Two scheduled runs (P7):
#
#   * `0 13 * * *`  (~09:00 ET): the FULL refresh -- Statcast (rolling 7-day
#     window), roster/participation, fielding, season stats (MLB Stats API
#     sabermetrics -- WAR etc.; no FanGraphs CSV needed), THEN a current-
#     season schedule refresh + a 3-day box-score re-pull. The box-score re-pull
#     is the West-Coast / late-final backfill: games still in progress at the
#     11:30 PM ET run get completed here.
#   * `30 3 * * *` (~11:30 PM ET): a LIGHT freshness run -- today's schedule
#     refresh + today's final box scores only. No Statcast / roster work.
#
# Per-run order is always schedule -> standings -> boxscore -> revalidate: pull_boxscore's
# final-game guard reads web_games.is_final, which pull_schedule populates.
#
# Both crons drift ~1h across DST (acceptable). GitHub cron is best-effort and
# can lag 10-15+ min; West-Coast road games (~10 PM - 1 AM ET) are intentionally
# left for the 09:00 ET backfill rather than chased at 11:30 PM.
#
# NOTE re: conda env rule. CLAUDE.md mandates the local conda env `MLBxBaZi`
# for any Python work and forbids creating a venv or `requirements.txt`. That
# rule targets the developer machine where MLBxBaZi already exists. GitHub
# Actions runners are ephemeral containers without conda, so we install the
# Python deps inline with pip. This is a per-run install, not a long-lived
# venv on the workstation; the spirit of the rule (single source of truth for
# local deps) is preserved.
name: daily-etl

on:
  schedule:
    - cron: "0 13 * * *"    # ~09:00 ET -- full refresh
    - cron: "30 3 * * *"    # ~11:30 PM ET -- today's finals only
  workflow_dispatch:

jobs:
  refresh:
    # ~09:00 ET full refresh (and any manual dispatch -- it is the superset).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Silences the Node 20 deprecation warning from setup-python until
      # an action release with native Node 24 support lands.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python deps (CI-only, see header note)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pybaseball==2.2.7" \
            "psycopg[binary]==3.2.1" \
            "python-dotenv==1.0.1" \
            "pandas==2.2.3" \
            "requests==2.32.3"

      - name: Determine current season window
        run: |
          echo "SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"
          echo "WINDOW_START=$(date -u -d '7 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "WINDOW_END=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Refresh 26-man roster
        run: python etl/roster.py

      - name: Refresh current-season participation table
        run: python etl/pull_team_players.py --season "$SEASON"

      - name: Pull batter Statcast (all current-season batters, 7-day window)
        run: |
          python etl/pull_statcast.py \
            --all-batters \
            --season "$SEASON" \
            --start "$WINDOW_START" \
            --end "$WINDOW_END"

      - name: Pull pitcher Statcast (all current-season pitchers, 7-day window)
        run: |
          python etl/pull_pitcher.py \
            --all-pitchers \
            --season "$SEASON" \
            --start "$WINDOW_START" \
            --end "$WINDOW_END"

      - name: Pull fielding OAA/FRV (season-to-date aggregate)
        run: python etl/pull_fielding.py --season "$SEASON"

      - name: Pull season stats (MLB Stats API -- OPS / wRC+ / ERA / FIP / WAR + Value components)
        run: python etl/pull_season_stats.py --season "$SEASON"

      # P7: schedule -> boxscore must run before revalidate. pull_boxscore guards
      # on web_games.is_final, so pull_schedule has to populate it first.
      # --recent 3 backfills West-Coast / late finals that were still in progress
      # at the 11:30 PM ET run.
      - name: Refresh schedule (web_games, current season)
        run: python etl/pull_schedule.py --season "$SEASON"

      - name: Refresh standings (web_standings, both leagues)
        run: python etl/pull_standings.py --season "$SEASON"

      - name: Pull box scores (last 3 days of finals)
        run: python etl/pull_boxscore.py --recent 3

      - name: Revalidate Next.js ISR cache
        run: |
          curl --fail --silent --show-error -X POST \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            "${REVALIDATE_URL}"

  nightly-finals:
    # ~11:30 PM ET freshness run: today's schedule + today's finals only.
    # No roster / Statcast work -- pull_boxscore self-heals unknown call-ups by
    # inserting their bio into web_players before the FK insert.
    if: github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Lighter dep set than the full refresh: schedule + boxscore need
      # requests (MLB API), psycopg (DB) and pandas (imported by etl/db.py);
      # pybaseball is not used here.
      - name: Install Python deps (CI-only, see header note)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "psycopg[binary]==3.2.1" \
            "python-dotenv==1.0.1" \
            "pandas==2.2.3" \
            "requests==2.32.3"

      - name: Determine current season
        run: echo "SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"

      # P7/P11: schedule -> standings -> boxscore -> revalidate.
      - name: Refresh schedule (web_games, current season)
        run: python etl/pull_schedule.py --season "$SEASON"

      - name: Refresh standings (web_standings, both leagues)
        run: python etl/pull_standings.py --season "$SEASON"

      - name: Pull box scores (today's finals)
        run: python etl/pull_boxscore.py --recent 1

      - name: Revalidate Next.js ISR cache
        run: |
          curl --fail --silent --show-error -X POST \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            "${REVALIDATE_URL}"
